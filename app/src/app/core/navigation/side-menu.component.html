<nav class="side-menu" aria-label="Menu principal">
  <mat-nav-list>
    <a
      mat-list-item
      *ngFor="let item of mainLinks"
      [routerLink]="item.path"
      routerLinkActive="is-active"
      (click)="onNavigate()"
    >
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label }}</span>
    </a>
  </mat-nav-list>

</nav>
